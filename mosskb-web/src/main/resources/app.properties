app.env=dev
server.port=10060
#tio.http.request.printUrl=true
server.http.controller.printMapping=true
server.http.request.printReport=true
http.multipart.max-request-size=110100480
http.multipart.max-file-size=104857600
server.resources.static-locations=pages
server.http.response.cors.enable=true
app.token.timeout=604800
app.name=java-mosskb
# 微信小程序：appid 与 secret 请通过环境变量或本机配置注入，不要提交到仓库。
# 环境变量名分别是 WECHAT_MINIAPP_APPID、WECHAT_MINIAPP_SECRET。
#wechat.miniapp.appid=
#wechat.miniapp.secret=
# 扫码后进入的小程序页面，留空时使用 pages/index/index
#wechat.miniapp.page=pages/index/index
# 生成小程序码的运行环境：release 正式版、trial 体验版、develop 开发版
#wechat.miniapp.env-version=develop
# 微信开放接口地址，需要走代理或本地联调时覆盖，留空时直连微信
#wechat.miniapp.api-base=https://api.weixin.qq.com
# 未配置微信凭据时是否允许本地直登，仅用于本地联调，发布环境请保持关闭
#wechat.miniapp.dev-login=true
# 小程序一次性返回回答的等待上限，单位毫秒
#wechat.miniapp.chat-timeout-ms=120000
